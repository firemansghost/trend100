# Manual-only utility workflow. Does not commit artifacts. Production deploy happens via vercel-prebuilt-prod.yml / daily-artifacts-deploy.yml.
name: Backfill Health History

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Number of days to backfill (default: 365)'
        required: false
        default: '365'
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backfill health history (offline from EOD cache)
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '365' }}
          MARKETSTACK_OFFLINE: '1'
          MARKETSTACK_CACHE_DAYS: 2300
          TREND100_STRICT_WARMUP: 1
          HEALTH_HISTORY_RETENTION_DAYS: 0
        run: |
          pnpm update:health-history -- --backfill-days $BACKFILL_DAYS
          pnpm verify:artifacts
